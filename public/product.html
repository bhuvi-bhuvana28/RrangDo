<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - RrangDo</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">

        <div class="logo">
            RrangDo
        </div>

        <div class="header-right">

            <a href="index.html">
                <i class="fa-solid fa-house"></i>
            </a>

            <a href="wishlist.html">
                <i class="fa-regular fa-heart"></i>
            </a>

            <a href="cart.html">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

        </div>

    </div>

    <!-- PRODUCT DETAILS -->
    <div class="product-details">

        <!-- LEFT -->
        <div class="product-left">

            <img
                id="product-image"
                src=""
                alt="Product Image">

        </div>

        <!-- RIGHT -->
        <div class="product-right">

            <h2 id="product-name"></h2>

            <p id="product-price"></p>

            <p id="product-size"></p>

            <!-- CART ROW -->
            <div class="cart-row">

                <div class="qty-control">

                    <button onclick="decreaseProductQty()">
                        -
                    </button>

                    <span id="qty">1</span>

                    <button onclick="increaseProductQty()">
                        +
                    </button>

                </div>

                <button
                    class="add-btn"
                    onclick="addCurrentProductToCart()">

                    ADD

                </button>

                <button
                    class="wish-btn"
                    onclick="addCurrentProductToWishlist()">

                    ❤️

                </button>

            </div>

        </div>

    </div>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const name =
            params.get("name");

        const price =
            params.get("price");

        const img1 =
            params.get("img1");

        const size =
            params.get("size");

        document.getElementById(
            "product-name"
        ).innerText = name;

        document.getElementById(
            "product-price"
        ).innerText =
            "₹" + price;

        document.getElementById(
            "product-size"
        ).innerText =
            size ? "Size: " + size : "";

        document.getElementById(
            "product-image"
        ).src = img1;

        let productQty = 1;

        function increaseProductQty() {

            productQty++;

            document.getElementById(
                "qty"
            ).innerText =
                productQty;

        }

        function decreaseProductQty() {

            if (productQty > 1) {

                productQty--;

                document.getElementById(
                    "qty"
                ).innerText =
                    productQty;

            }

        }

        function addCurrentProductToCart() {

            addToCartWithQty(
                name,
                price,
                img1,
                productQty
            );

        }

        function addCurrentProductToWishlist() {

            addToWishlist(
                name,
                price,
                img1
            );

        }

    </script>

    <script src="script.js"></script>

</body>

</html>
