<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">

    <div class="logo">
      RrangoDoIndia
    </div>

    <div class="header-right">

      <a href="index.html">
        🏠 Home
      </a>

      <a href="cart.html">
        🛒 Cart
      </a>

      <a href="wishlist.html">
        ❤️ Wishlist
      </a>

    </div>

  </div>

  <!-- PRODUCT DETAILS -->
  <div class="product-details">

    <!-- LEFT -->
    <div class="product-left">

      <img
        id="product-image"
        alt="Product Image"
      >

    </div>

    <!-- RIGHT -->
    <div class="product-right">

      <h2 id="product-name"></h2>

      <p id="product-price"></p>

      <!-- CART ROW -->
      <div class="cart-row">

        <!-- QTY -->
        <div class="qty-control">

          <button onclick="decreaseProductQty()">
            -
          </button>

          <span id="qty">
            1
          </span>

          <button onclick="increaseProductQty()">
            +
          </button>

        </div>

        <!-- ADD -->
        <button
          class="add-btn"
          onclick="addCurrentProductToCart()"
        >
          ADD
        </button>

        <!-- WISHLIST -->
        <button
          class="wish-btn"
          onclick="addCurrentProductToWishlist()"
        >
          ❤️
        </button>

      </div>

    </div>

  </div>

  <script>

    // URL PARAMS
    const params = new URLSearchParams(window.location.search);

    const name = params.get("name");
    const price = Number(params.get("price"));
    const img1 = params.get("img1");

    // SET DATA
    document.getElementById("product-name").innerText = name;

    document.getElementById("product-price").innerText =
      "₹" + price;

    document.getElementById("product-image").src = img1;

    // QTY
    let productQty = 1;

    function increaseProductQty() {

      productQty++;

      document.getElementById("qty").innerText =
        productQty;

    }

    function decreaseProductQty() {

      if (productQty > 1) {

        productQty--;

        document.getElementById("qty").innerText =
          productQty;

      }

    }

    // ADD TO CART
    function addCurrentProductToCart() {

      addToCartWithQty(
        name,
        price,
        img1,
        productQty
      );

    }

    // ADD TO WISHLIST
    function addCurrentProductToWishlist() {

      addToWishlist(
        name,
        price,
        img1
      );

    }

  </script>

  <script src="script.js"></script>

</body>

</html>
