<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Select Delivery Address</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center;">
  📍 Select Delivery Address
</h2>

<div class="address-container">

  <div id="saved-address-box"></div>

</div>

<script>

// GET SAVED ADDRESS
let savedAddress =
JSON.parse(localStorage.getItem("userAddress"));

let box =
document.getElementById("saved-address-box");

// IF ADDRESS EXISTS
if(savedAddress){

  box.innerHTML = `

    <div class="address-card">

      <h3>${savedAddress.name}</h3>

      <p>📞 ${savedAddress.phone}</p>

      <p>
        ${savedAddress.house},
        ${savedAddress.area}
      </p>

      <p>
        ${savedAddress.city},
        ${savedAddress.state}
      </p>

      <p>
        Pincode: ${savedAddress.pincode}
      </p>

    </div>

    <div style="text-align:center; margin-top:20px;">

      <button onclick="useThisAddress()"
      class="main-btn">

        ✅ Continue with this Address

      </button>

      <br><br>

      <button onclick="addNewAddress()"
      class="secondary-btn">

        ✏️ Change Address

      </button>

    </div>

  `;

}else{

  box.innerHTML = `

    <p style="text-align:center;">
      No saved address ❌
    </p>

    <div style="text-align:center; margin-top:20px;">

      <button onclick="addNewAddress()"
      class="secondary-btn">

        ➕ Add Address

      </button>

    </div>
  `;
}

// FUNCTIONS
function useThisAddress(){

  window.location.href = "checkout.html";

}

function addNewAddress(){

  window.location.href = "location.html";

}

</script>

</body>
</html>
